# Profiles used by the "Play folder in mpv" right-click menu.
# Installed by install.sh and loaded from mpv.conf with: include="~~/mpv-play-folder.conf"
[music]
profile-desc="Folder of audio files"
force-window=immediate          # give audio-only playback a window to control/close
audio-display=embedded-first    # show embedded cover art, else cover.jpg
cover-art-auto=fuzzy
directory-filter-types=audio    # don't queue cover.jpg / booklets as playlist items
gapless-audio=yes
replaygain=album
af-clr=""                       # bit-perfect-ish: drop any global audio filters
audio-channels=auto
save-position-on-quit=yes       # with resume-playback: reopening an album picks up mid-track
resume-playback=yes
loop-playlist=yes
# terminal niceties (from ~/music.profile), used when run as `mpv --profile=music DIR`
term-osd-bar=yes
term-osd-bar-chars="[-+-]"
term-playing-msg="${filename}"
msg-level="cplayer=no,sub/ass=no,display-tags=no"
msg-module=no

[videos]
profile-desc="Folder of video files"
directory-filter-types=video
vo=gpu-next
gpu-api=vulkan,opengl                         # vulkan first, GL fallback
gpu-context=waylandvk,x11vk,wayland,x11egl    # Wayland or X11 sessions
hwdec=nvdec,vulkan,vaapi,auto-safe
fullscreen=yes
save-position-on-quit=yes                     # resume where you left off
